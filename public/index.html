<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIJira — AI Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="9" fill="#7c3aed"/>
          <path d="M8 11h11M8 16h7M8 21h9" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="23" cy="21" r="4.5" fill="white"/>
          <path d="M21 21l1.4 1.5L25 19" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">AIJira</div>
        <div class="brand-sub">AI Task Manager</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 4a2 2 0 012-2h3a2 2 0 012 2v3a2 2 0 01-2 2H4a2 2 0 01-2-2V4zm9 0a2 2 0 012-2h3a2 2 0 012 2v3a2 2 0 01-2 2h-3a2 2 0 01-2-2V4zM2 13a2 2 0 012-2h3a2 2 0 012 2v3a2 2 0 01-2 2H4a2 2 0 01-2-2v-3zm9 0a2 2 0 012-2h3a2 2 0 012 2v3a2 2 0 01-2 2h-3a2 2 0 01-2-2v-3z"/></svg>
        Dashboard
      </button>
      <button class="nav-btn" data-view="board" onclick="showView('board')">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 4a1 1 0 011-1h4a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V4zm6 0a1 1 0 011-1h4a1 1 0 011 1v12a1 1 0 01-1 1H9a1 1 0 01-1-1V4zm6 0a1 1 0 011-1h4a1 1 0 011 1v12a1 1 0 01-1 1h-4a1 1 0 01-1-1V4z"/></svg>
        Board
      </button>
      <button class="nav-btn" data-view="projects" onclick="showView('projects')">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
        Projects
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="ai-chip" id="ai-chip">
        <span class="ai-dot" id="ai-dot"></span>
        <span id="ai-chip-text">AI Idle</span>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="page-title">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <button class="btn-ghost" onclick="openProjectModal()">
          <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
          New Project
        </button>
        <button class="btn-primary" onclick="openTicketModal()">
          <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
          New Ticket
        </button>
      </div>
    </header>

    <div class="content">
      <div id="view-dashboard" class="view active"></div>
      <div id="view-board"     class="view"></div>
      <div id="view-projects"  class="view"></div>
    </div>
  </div>
</div>

<!-- ── Ticket Modal ── -->
<div id="ticket-modal" class="modal-overlay hidden" onclick="overlayClick(event,'ticket-modal')">
  <div class="modal-box">
    <div class="modal-hdr">
      <h2 id="ticket-modal-title">New Ticket</h2>
      <button class="modal-x" onclick="closeModal('ticket-modal')">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      </button>
    </div>
    <form id="ticket-form" onsubmit="submitTicket(event)">
      <div class="modal-body">
        <div class="fg">
          <label>Title <span class="req">*</span></label>
          <input type="text" id="ft-title" placeholder="What needs to be done?" required autocomplete="off">
        </div>
        <div class="fg-row">
          <div class="fg" style="flex:1">
            <label>Project</label>
            <div class="select-with-add">
              <select id="ft-project"><option value="">— No project —</option></select>
              <button type="button" class="add-btn" onclick="openProjectModal(true)" title="Create new project">+</button>
            </div>
          </div>
          <div class="fg" style="flex:0 0 auto">
            <label>Priority</label>
            <div class="prio-pills">
              <label class="pp high"><input type="radio" name="priority" value="high"> HIGH</label>
              <label class="pp mid"><input type="radio" name="priority" value="mid" checked> MID</label>
              <label class="pp low"><input type="radio" name="priority" value="low"> LOW</label>
            </div>
          </div>
        </div>
        <div class="fg">
          <label>Working Directory <small class="hint">keyword or path — blank to inherit from project</small></label>
          <input type="text" id="ft-dir" placeholder="e.g. greekdesire  or  /Users/admin/Documents/…" autocomplete="off">
        </div>
        <div class="fg">
          <label>Description</label>
          <textarea id="ft-desc" rows="4" placeholder="Describe the task in detail for AI…"></textarea>
        </div>
      </div>
      <div class="modal-ftr">
        <button type="button" class="btn-ghost" onclick="closeModal('ticket-modal')">Cancel</button>
        <button type="submit" class="btn-primary" id="ticket-submit-btn">Create Ticket</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Project Modal ── -->
<div id="project-modal" class="modal-overlay hidden" onclick="overlayClick(event,'project-modal')">
  <div class="modal-box modal-wide">
    <div class="modal-hdr">
      <h2 id="project-modal-title">New Project</h2>
      <button class="modal-x" onclick="closeModal('project-modal')">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      </button>
    </div>
    <form id="project-form" onsubmit="submitProject(event)">
      <div class="modal-body">
        <div class="fg-row">
          <div class="fg" style="flex:1">
            <label>Project Name <span class="req">*</span></label>
            <input type="text" id="fp-name" placeholder="e.g. GreekDesire" required autocomplete="off">
          </div>
          <div class="fg color-fg">
            <label>Color</label>
            <div class="swatches" id="swatches"></div>
          </div>
        </div>
        <div class="fg">
          <label>Project Type</label>
          <div class="type-toggle" id="type-toggle">
            <button type="button" class="type-opt active" data-type="existing" onclick="setProjectType('existing')">
              <span class="type-opt-icon">📁</span>
              <div><div class="type-opt-label">Existing</div><div class="type-opt-sub">AI will find the directory</div></div>
            </button>
            <button type="button" class="type-opt" data-type="new" onclick="setProjectType('new')">
              <span class="type-opt-icon">✨</span>
              <div><div class="type-opt-label">New Project</div><div class="type-opt-sub">AI will create the directory</div></div>
            </button>
          </div>
        </div>
        <div class="fg">
          <label>Description</label>
          <input type="text" id="fp-desc" placeholder="What is this project about?" autocomplete="off">
        </div>
        <div class="fg">
          <label id="fp-location-label">Location <small class="hint" id="fp-location-hint">keyword or full path — AI will find this directory</small></label>
          <input type="text" id="fp-location" placeholder="e.g. greekdesire  or  /Users/admin/Documents/Thomas-SRC/MyApp" autocomplete="off">
        </div>
        <div class="fg">
          <label>Tech Stack</label>
          <input type="text" id="fp-tech" placeholder="e.g. Next.js 15, PostgreSQL, Docker, Java Spring Boot" autocomplete="off">
        </div>
        <div class="fg">
          <label>AI Knowledge <small class="hint">extra context AI reads before starting work</small></label>
          <textarea id="fp-notes" rows="3" placeholder="Architecture notes, important paths, deployment info, gotchas…"></textarea>
        </div>
      </div>
      <div class="modal-ftr">
        <button type="button" class="btn-ghost" onclick="closeModal('project-modal')">Cancel</button>
        <button type="submit" class="btn-primary" id="project-submit-btn">Create Project</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
